<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏆 Participants — Crossword 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #f0f2f5;
      color: #1e2b3c;
      padding: 24px;
      min-height: 100vh;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      padding: 26px 28px 34px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 3px solid #dce3ec;
      padding-bottom: 14px;
      margin-bottom: 8px;
    }
    h1 { font-size: 24px; color: #1e2b3c; font-weight: 600; }
    .sub { font-size: 13px; color: #5a6f84; margin-bottom: 20px; }

    button {
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 22px;
      border: none;
      border-radius: 30px;
      background: #1e3a5f;
      color: #fff;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 3px 0 #0f283f;
    }
    button:hover { background: #274b78; transform: translateY(-2px); }
    button:active { transform: translateY(2px); box-shadow: 0 0 0 #0f283f; }
    button:disabled { background: #6a7f94; cursor: not-allowed; transform: none; box-shadow: 0 3px 0 #4a5a6a; }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
    .controls input {
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      border: 2px solid #d7e0eb;
      border-radius: 12px;
      background: #fff;
      outline: none;
      transition: 0.15s;
      flex: 1;
      min-width: 200px;
    }
    .controls input:focus {
      border-color: #1e3a5f;
      box-shadow: 0 0 0 3px rgba(30,58,95,0.15);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat {
      background: #f8faff;
      border: 2px solid #dce5ef;
      border-radius: 16px;
      padding: 14px 16px;
    }
    .stat .label {
      font-size: 12px;
      color: #4a5f76;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 4px;
    }
    .stat .value { font-size: 26px; font-weight: 700; color: #1e3a5f; }

    .table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid #eef2f7; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      background: #f8faff;
      padding: 12px 14px;
      text-align: left;
      font-weight: 700;
      color: #1f3857;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-bottom: 2px solid #dce5ef;
      position: sticky;
      top: 0;
    }
    td { padding: 10px 14px; border-bottom: 1px solid #f0f2f5; color: #1f3349; }
    tr:hover td { background: #fafcff; }
    tr.rank-1 td { background: #fff8dc; }
    tr.rank-2 td { background: #f7f7f7; }
    tr.rank-3 td { background: #fbeee0; }

    .medal { font-size: 17px; margin-right: 4px; }
    .rank-col { width: 70px; font-weight: 700; color: #1e3a5f; }

    .msg { text-align: center; padding: 40px 20px; color: #5a6f84; font-size: 15px; }
    .err { background: #ffe0e0; color: #b3363a; padding: 12px 16px; border-radius: 12px; margin: 14px 0; font-size: 14px; }
    .hidden { display: none; }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid #eef2f7;
      border-top-color: #1e3a5f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      body { padding: 10px; }
      .wrap { padding: 18px 14px 24px; }
      h1 { font-size: 18px; }
      th, td { padding: 8px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>🏆 Participants — Crossword 2026</h1>
    <button id="refreshBtn">🔄 Refresh</button>
  </header>
  <div class="sub">Ranking = highest score first, then fastest time as tie-breaker</div>

  <div class="controls">
    <input id="searchBox" type="text" placeholder="Search by name or Emp No..." />
  </div>

  <div class="stats">
    <div class="stat"><div class="label">Participants</div><div class="value" id="statCount">0</div></div>
    <div class="stat"><div class="label">Top Score</div><div class="value" id="statTop">—</div></div>
    <div class="stat"><div class="label">Fastest Time</div><div class="value" id="statFast">—</div></div>
  </div>

  <div id="errBox" class="err hidden"></div>
  <div id="loadingMsg" class="msg"><span class="spinner"></span> Loading participants...</div>

  <div class="table-wrap hidden" id="tableWrap">
    <table>
      <thead>
        <tr>
          <th class="rank-col">Rank</th>
          <th>Name</th>
          <th>Emp No</th>
          <th>Designation</th>
          <th>Mobile</th>
          <th style="text-align:center;">Score</th>
          <th style="text-align:center;">Total</th>
          <th style="text-align:center;">%</th>
          <th>Duration</th>
          <th>Submitted At</th>
        </tr>
      </thead>
      <tbody id="lbBody"></tbody>
    </table>
  </div>

</div>

<script>
  (function() {
    // ===== SAME URL AS index.html =====
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyyU263GrJRz_zwC_8hl_FBqklyWEJiOAopOnrv6uc_pcQ7r75CsRXuq0v_fnt0LxyMrg/exec';

    // ---- Robust fetch with retry & JSON check ----
    function fetchJSON(url, retries) {
      if (typeof retries === 'undefined') retries = 3;
      return fetch(url, { cache: 'no-store', redirect: 'follow' })
        .then(function(r) {
          var ct = (r.headers.get('content-type') || '').toLowerCase();
          if (ct.indexOf('application/json') === -1) {
            return r.text().then(function(txt) {
              throw new Error('Non-JSON response: ' + txt.substring(0, 80));
            });
          }
          return r.json();
        })
        .catch(function(err) {
          if (retries > 0) {
            return new Promise(function(res) { setTimeout(res, 500); })
              .then(function() { return fetchJSON(url, retries - 1); });
          }
          throw err;
        });
    }

    let allRows = [];

    function loadLeaderboard() {
      document.getElementById('loadingMsg').classList.remove('hidden');
      document.getElementById('tableWrap').classList.add('hidden');
      document.getElementById('errBox').classList.add('hidden');
      document.getElementById('refreshBtn').disabled = true;

      fetchJSON(GAS_URL + '?action=getLeaderboard&_=' + Date.now())
        .then(function(data) {
          if (!data.success) throw new Error(data.error || 'Failed to load');
          allRows = data.data || [];
          render();
          document.getElementById('loadingMsg').classList.add('hidden');
          document.getElementById('tableWrap').classList.remove('hidden');
        })
        .catch(function(err) {
          document.getElementById('loadingMsg').classList.add('hidden');
          var box = document.getElementById('errBox');
          box.textContent = 'Failed to load participants: ' + err.message;
          box.classList.remove('hidden');
        })
        .finally(function() {
          document.getElementById('refreshBtn').disabled = false;
        });
    }

    function render() {
      var search = document.getElementById('searchBox').value.trim().toLowerCase();

      var rows = allRows.slice();

      if (search) {
        rows = rows.filter(function(r) {
          return (r.name || '').toLowerCase().indexOf(search) !== -1
              || String(r.rollNumber || '').indexOf(search) !== -1;
        });
      }

      // Sort: highest score first, then fastest duration
      rows.sort(function(a, b) {
        if (b.score !== a.score) return b.score - a.score;
        return (a.durationSeconds || 0) - (b.durationSeconds || 0);
      });

      document.getElementById('statCount').textContent = rows.length;
      if (rows.length) {
        document.getElementById('statTop').textContent = rows[0].score;
        var fastest = rows.reduce(function(min, r) {
          return (r.durationSeconds || 9999) < (min.durationSeconds || 9999) ? r : min;
        }, rows[0]);
        document.getElementById('statFast').textContent = fastest.duration || '—';
      } else {
        document.getElementById('statTop').textContent = '—';
        document.getElementById('statFast').textContent = '—';
      }

      var tbody = document.getElementById('lbBody');
      tbody.innerHTML = '';

      if (!rows.length) {
        var trEmpty = document.createElement('tr');
        trEmpty.innerHTML = '<td colspan="10" class="msg">No participants yet.</td>';
        tbody.appendChild(trEmpty);
        return;
      }

      rows.forEach(function(r, idx) {
        var rank = idx + 1;
        var tr = document.createElement('tr');
        if (rank === 1) tr.className = 'rank-1';
        if (rank === 2) tr.className = 'rank-2';
        if (rank === 3) tr.className = 'rank-3';

        var medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';

        tr.innerHTML =
          '<td class="rank-col">' + rank + ' <span class="medal">' + medal + '</span></td>' +
          '<td>' + esc(r.name) + '</td>' +
          '<td>' + esc(r.rollNumber) + '</td>' +
          '<td>' + esc(r.designation) + '</td>' +
          '<td>' + esc(r.mobile) + '</td>' +
          '<td style="text-align:center;font-weight:700;color:#1e3a5f;">' + (r.score || 0) + '</td>' +
          '<td style="text-align:center;">' + (r.totalLetters || 0) + '</td>' +
          '<td style="text-align:center;">' + (r.percentage || 0) + '%</td>' +
          '<td>' + esc(r.duration || '—') + '</td>' +
          '<td style="font-size:12px;color:#5a6f84;">' + esc(r.timestamp || '—') + '</td>';
        tbody.appendChild(tr);
      });
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.getElementById('refreshBtn').addEventListener('click', loadLeaderboard);
    document.getElementById('searchBox').addEventListener('input', render);

    // Auto-refresh every 30 seconds
    setInterval(loadLeaderboard, 30000);

    // Initial load
    loadLeaderboard();

  })();
</script>
</body>
</html>
